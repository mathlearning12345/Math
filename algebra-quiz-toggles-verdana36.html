<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Algebra Essentials Quiz (Verdana 36)</title>
<style>
:root{
  --bg:#f7f6fa;--card:#ffffff;--card2:#f7f5fb;--border:#e4e1ec;
  --accent:#6d5ef5;--accent-hover:#5a4bdc;--accent-soft:#efecfd;
  --green:#2e9e5e;--green-bg:#edfaf3;--green-border:#a8e4c0;
  --red:#d94f4f;--red-bg:#fdf0f0;--red-border:#f0b0b0;
  --text:#1c1a22;--muted:#8a8594;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:Verdana,Geneva,sans-serif;
  min-height:100vh;display:flex;justify-content:center;padding:16px 12px 60px;}
.app{width:100%;max-width:1100px;}
.hidden{display:none !important;}

.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:14px 0 12px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.hdr h1{font-size:1rem;font-weight:700;letter-spacing:-0.01em;}
.stats{display:flex;gap:10px;font-size:1rem;color:var(--muted);}
.stat strong{color:var(--text);font-weight:700;}

/* ── SETUP WIZARD ─────────────────────────── */
.wiz-dots{display:flex;justify-content:center;gap:6px;margin-bottom:14px;}
.wiz-dot{width:7px;height:7px;border-radius:50%;background:#e4e1ec;transition:background .15s;}
.wiz-dot.done{background:var(--accent);}
.wiz-dot.current{background:var(--accent);width:18px;border-radius:4px;}
.wiz-crumb{font-size:1rem;color:var(--muted);text-align:center;margin-bottom:18px;line-height:1.5;min-height:1.1em;}
.setup-sec{margin-bottom:20px;}
.setup-label{font-size:1rem;font-weight:700;color:#999;letter-spacing:.06em;
  text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:7px;}
.step-num{display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;border-radius:50%;background:#ece9f3;color:#7a7488;
  font-size:1rem;font-weight:700;letter-spacing:0;}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.opt-grid.single{grid-template-columns:1fr;}
.opt-card{background:var(--card);border:1.5px solid var(--border);border-radius:10px;
  padding:11px 12px;cursor:pointer;transition:border-color .12s,background .12s;user-select:none;
  position:relative;}
.opt-card:hover{border-color:#cfc9df;}
.opt-card.sel{border-color:var(--accent);background:var(--accent-soft);}
.opt-badge{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:1rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.15);}
.opt-title{font-size:1rem;font-weight:700;margin-bottom:2px;}
.opt-card.sel .opt-title{color:var(--accent-hover);}

.tog-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;user-select:none;}
.tog-row.on{border-color:var(--accent);background:var(--accent-soft);}
.tog-num{width:1.4em;font-weight:800;color:var(--accent);font-size:1rem;text-align:right;flex:none;}
.tog-text{flex:1;min-width:0;}
.tog-switch{flex:none;width:40px;height:24px;border-radius:12px;background:#cfc9df;position:relative;transition:background .15s;}
.tog-knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s;}
.tog-row.on .tog-switch{background:var(--accent);}
.tog-row.on .tog-knob{transform:translateX(16px);}
.opt-num{color:var(--accent);font-weight:800;}
.opt-desc{font-size:1rem;color:var(--muted);line-height:1.35;}
.setup-note{font-size:1rem;color:var(--muted);font-style:italic;margin-top:6px;min-height:1px;}
.wiz-foot{display:flex;flex-direction:column;gap:10px;}
.wiz-nav-row{display:flex;gap:8px;align-items:center;}
.back-btn{background:none;border:1px solid var(--border);border-radius:10px;color:var(--muted);
  font-size:1rem;font-weight:700;padding:12px 16px;cursor:pointer;}
.back-btn:hover{border-color:#cfc9df;color:var(--text);}
.continue-btn{flex:1;background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:12px;font-size:1rem;font-weight:700;cursor:pointer;}
.continue-btn:hover{background:var(--accent-hover);}
.continue-btn:disabled{background:#cfc9df;cursor:default;}
.wiz-review{margin-bottom:4px;}
.review-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--border);font-size:1rem;}
.review-row:last-child{border-bottom:none;}
.review-row .rlabel{color:var(--muted);font-size:1rem;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
.review-row .rvalue{font-weight:700;text-align:right;}
.start-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:14px;font-size:1rem;font-weight:700;cursor:pointer;}
.start-btn:hover{background:var(--accent-hover);}

/* ── QUIZ SCREEN ──────────────────────────── */
.quiz-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;}
.quiz-bar-btns{display:flex;gap:6px;}
.setup-summary{font-size:1rem;color:var(--muted);line-height:1.4;}
.change-btn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);
  font-size:1rem;font-weight:700;padding:6px 10px;cursor:pointer;white-space:nowrap;}
.change-btn:hover{border-color:#cfc9df;color:var(--text);}

.q-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:18px 16px;margin-bottom:14px;}
.topic-label{font-size:1rem;font-weight:700;color:var(--accent);letter-spacing:.05em;
  text-transform:uppercase;margin-bottom:10px;}
.context-wrap{background:var(--card2);border-left:3px solid var(--accent);border-radius:6px;
  padding:10px 12px;margin-bottom:10px;font-size:1rem;line-height:1.5;color:var(--text);}
.formula-wrap{font-size:1rem;font-weight:700;margin-bottom:10px;text-align:center;}
.prompt{font-size:1rem;font-weight:600;text-align:center;line-height:1.4;margin-bottom:12px;}
.expr-display{font-size:1rem;font-weight:700;text-align:center;line-height:1.6;
  font-family:Verdana,Geneva,sans-serif;letter-spacing:.01em;padding:6px 4px;word-break:break-word;}
.expr-display i{font-style:italic;font-family:Verdana,Geneva,sans-serif;}
.words-display{font-size:1rem;font-weight:600;text-align:center;line-height:1.5;font-style:italic;}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;
  margin:0 .18em;font-size:.82em;line-height:1.15;position:relative;top:.08em;}
.frac .fnum{border-bottom:1.6px solid currentColor;padding:0 .3em .1em;}
.frac .fden{padding:.1em .3em 0;}
.sqin{border-top:1.6px solid currentColor;padding:1px .15em 0;display:inline-block;}

#answer-area{margin-bottom:14px;}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.choice-btn{background:var(--card);border:1.5px solid var(--border);border-radius:10px;
  padding:13px 8px;font-size:1rem;font-weight:700;cursor:pointer;text-align:center;
  font-family:Verdana,Geneva,sans-serif;}
.choice-btn i{font-style:italic;font-family:Verdana,Geneva,sans-serif;}
.choice-btn:hover{border-color:#cfc9df;}
.choice-btn:disabled{cursor:default;}
.choice-btn.ok{border-color:var(--green-border);background:var(--green-bg);color:var(--green);}
.choice-btn.bad{border-color:var(--red-border);background:var(--red-bg);color:var(--red);}

.type-row{display:flex;gap:8px;}
.type-row input{flex:1;border:1.5px solid var(--border);border-radius:10px;padding:12px;
  font-size:1rem;font-family:Verdana,Geneva,sans-serif;}
.type-row input:focus{outline:none;border-color:var(--accent);}
.type-hint{font-size:1rem;color:var(--muted);margin-top:6px;}
.submit-btn{background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:12px 18px;font-size:1rem;font-weight:700;cursor:pointer;}
.submit-btn:disabled{background:#cfc9df;cursor:default;}

.feedback{display:none;background:var(--card2);border:1px solid var(--border);
  border-radius:12px;padding:14px;margin-bottom:14px;}
.fb-banner{font-size:1rem;font-weight:700;margin-bottom:6px;}
.fb-banner.ok{color:var(--green);}
.fb-banner.err{color:var(--red);}
.fb-answer{font-size:1rem;font-weight:600;font-family:Verdana,Geneva,sans-serif;}
.fb-answer i{font-style:italic;font-family:Verdana,Geneva,sans-serif;}
.fb-steps{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.fb-steps-title{font-size:1rem;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;margin-bottom:6px;}
.fb-steps-list{padding-left:1.2em;}
.fb-steps-list li{font-size:1rem;line-height:1.55;margin-bottom:4px;font-family:Verdana,Geneva,sans-serif;}
.fb-steps-list li i{font-style:italic;font-family:Verdana,Geneva,sans-serif;}
.fb-steps-list li b{font-weight:700;}
.next-btn{display:none;width:100%;background:var(--text);color:#fff;border:none;border-radius:10px;
  padding:14px;font-size:1rem;font-weight:700;cursor:pointer;}
.next-btn:hover{opacity:.9;}

/* ── RESULTS SCREEN ───────────────────────── */
.results-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:22px 18px;text-align:center;}
.results-title{font-size:1rem;font-weight:800;margin-bottom:4px;}
.results-sub{font-size:1rem;color:var(--muted);margin-bottom:18px;}
.results-row{display:flex;justify-content:space-between;align-items:baseline;
  padding:11px 0;border-bottom:1px solid var(--border);font-size:1rem;text-align:left;}
.results-row:last-child{border-bottom:none;}
.results-btns{display:flex;flex-direction:column;gap:8px;margin-top:18px;}
.results-btns .start-btn{margin:0;}
.results-secondary{background:none;border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-size:1rem;font-weight:700;padding:13px;cursor:pointer;}
.results-secondary:hover{border-color:#cfc9df;}

/* ---- Verdana 36 version ---- */
html{font-size:36px;}
body,button,input,textarea{font-family:Verdana,Geneva,sans-serif;font-size:36px;}
.expr-display,.choice-btn,.fb-answer,.fb-steps-list li{font-family:Verdana,Geneva,sans-serif;}
.expr-display i,.choice-btn i,.fb-answer i,.fb-steps-list li i{font-family:Verdana,Geneva,sans-serif;}
.step-num{width:1.5em;height:1.5em;font-size:.6em;}
.opt-badge{width:1.4em;height:1.4em;top:-.35em;right:-.35em;font-size:.6em;}
.wiz-dot{width:14px;height:14px;}.wiz-dot.current{width:36px;}
.tog-switch{width:80px;height:48px;border-radius:24px;}
.tog-knob{width:40px;height:40px;top:4px;left:4px;}
.tog-row.on .tog-knob{transform:translateX(32px);}
.tog-row{gap:18px;padding:16px 20px;}
.tog-num{width:1.6em;}
.opt-card{padding:16px 18px;}
.opt-grid{gap:14px;}
.fb-steps-list li{line-height:1.5;}
</style>
</head>
<body>
<div class="app">

  <div class="hdr">
    <h1>Algebra Essentials</h1>
    <div class="stats">
      <span class="stat hidden" id="stat-timer-wrap">&#9201;&nbsp;<strong id="stat-timer">0:00</strong></span>
      <span class="stat hidden" id="stat-streak-wrap">&#9733;&nbsp;<strong id="stat-streak">0</strong></span>
    </div>
  </div>

  <!-- ===================== SETUP SCREEN ===================== -->
  <div id="setup-screen">
    <div class="wiz-dots" id="wiz-dots"></div>
    <div class="wiz-crumb" id="wiz-crumb"></div>

    <div id="wiz-body"></div>

    <div class="wiz-foot">
      <div class="wiz-nav-row">
        <button class="back-btn hidden" id="wiz-back" onclick="stepBack()">&larr; Back</button>
        <button class="continue-btn hidden" id="wiz-continue" onclick="stepContinue()">Continue &rarr;</button>
      </div>
      <div id="review-block" class="hidden">
        <div class="wiz-review" id="wiz-review"></div>
        <button class="start-btn" onclick="startQuiz()">Start Quiz</button>
      </div>
    </div>
  </div>

  <!-- ===================== QUIZ SCREEN ===================== -->
  <div id="quiz-screen" class="hidden">
    <div class="quiz-bar">
      <div class="setup-summary" id="setup-summary"></div>
      <div class="quiz-bar-btns">
        <button class="change-btn" onclick="goToSetupFromQuiz()">Change</button>
        <button class="change-btn" onclick="endQuiz(false)">Finish</button>
      </div>
    </div>

    <div class="q-card">
      <div class="topic-label" id="q-topic-label"></div>
      <div class="context-wrap hidden" id="q-context"></div>
      <div class="formula-wrap hidden" id="q-formula"></div>
      <div class="prompt" id="q-prompt"></div>
      <div class="expr-display hidden" id="q-expr"></div>
      <div class="words-display hidden" id="q-words"></div>
    </div>

    <div id="answer-area">
      <div class="choice-grid hidden" id="choice-grid"></div>
      <div class="type-row hidden" id="type-row">
        <input type="text" id="type-input" placeholder="Type your answer" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="submit-btn" id="type-submit" onclick="submitTyped()">Check</button>
      </div>
      <div class="type-hint hidden" id="type-hint">e.g. 2x+10, 3/(4y), or a number</div>
    </div>

    <div class="feedback" id="feedback">
      <div class="fb-banner" id="fb-banner"></div>
      <div class="fb-answer" id="fb-answer"></div>
      <div class="fb-steps hidden" id="fb-steps"></div>
    </div>

    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question &rarr;</button>
  </div>

  <!-- ===================== RESULTS SCREEN ===================== -->
  <div id="results-screen" class="hidden">
    <div class="results-card">
      <div class="results-title" id="results-title">Quiz Complete!</div>
      <div class="results-sub" id="results-sub"></div>
      <div class="results-row"><span class="rlabel">Score</span><span class="rvalue" id="res-score"></span></div>
      <div class="results-row"><span class="rlabel">Best Streak</span><span class="rvalue" id="res-beststreak"></span></div>
      <div class="results-btns">
        <button class="start-btn" onclick="restartSameSetup()">Play Again</button>
        <button class="results-secondary" onclick="goToSetupFromResults()">Change Setup</button>
      </div>
    </div>
  </div>

</div>

<script>
// =========================================================================
// PURE LOGIC (expression engine, term builders, topic generators,
// distractor generation) — tested independently via node before being
// embedded here. See merged_logic.js / test_*.js in the build workspace.
// =========================================================================
</script>
<script>
// ===== engine.js =====

// ===================== Expression Engine =====================
// Tokenizer + recursive descent parser + evaluator for simple algebraic
// expressions: + - * / ^ ( ) , single-letter variables, integers/decimals,
// implicit multiplication (2x, 3(x+1), xy, (x+1)(x-1)), unary minus,
// and a few named functions: sqrt(...).

function tokenize(str) {
  const toks = [];
  let i = 0;
  const s = str.replace(/\s+/g, '');
  while (i < s.length) {
    const c = s[i];
    if (/[0-9.]/.test(c)) {
      let j = i;
      while (j < s.length && /[0-9.]/.test(s[j])) j++;
      toks.push({ type: 'NUM', value: parseFloat(s.slice(i, j)) });
      i = j;
    } else if (/[a-zA-Z]/.test(c)) {
      // check for function name "sqrt"
      if (s.slice(i, i + 4) === 'sqrt' && s[i + 4] === '(') {
        toks.push({ type: 'FUNC', value: 'sqrt' });
        i += 4;
      } else {
        toks.push({ type: 'VAR', value: c });
        i++;
      }
    } else if (c === '+' || c === '-' || c === '*' || c === '/' || c === '^') {
      toks.push({ type: 'OP', value: c });
      i++;
    } else if (c === '(') {
      toks.push({ type: 'LP' });
      i++;
    } else if (c === ')') {
      toks.push({ type: 'RP' });
      i++;
    } else {
      throw new Error('Unexpected character: ' + c);
    }
  }
  return toks;
}

// Insert explicit '*' tokens for implicit multiplication.
function insertImplicitMul(toks) {
  const out = [];
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    if (out.length > 0) {
      const prev = out[out.length - 1];
      const prevEndsValue = prev.type === 'NUM' || prev.type === 'VAR' || prev.type === 'RP';
      const curStartsValue = t.type === 'NUM' || t.type === 'VAR' || t.type === 'LP' || t.type === 'FUNC';
      if (prevEndsValue && curStartsValue) {
        out.push({ type: 'OP', value: '*' });
      }
    }
    out.push(t);
  }
  return out;
}

function parseExpr(str) {
  const toks = insertImplicitMul(tokenize(str));
  let pos = 0;
  function peek() { return toks[pos]; }
  function next() { return toks[pos++]; }

  function parseAddSub() {
    let node = parseMulDiv();
    while (peek() && peek().type === 'OP' && (peek().value === '+' || peek().value === '-')) {
      const op = next().value;
      const rhs = parseMulDiv();
      node = { type: 'bin', op, left: node, right: rhs };
    }
    return node;
  }
  function parseMulDiv() {
    let node = parseUnary();
    while (peek() && peek().type === 'OP' && (peek().value === '*' || peek().value === '/')) {
      const op = next().value;
      const rhs = parseUnary();
      node = { type: 'bin', op, left: node, right: rhs };
    }
    return node;
  }
  function parseUnary() {
    if (peek() && peek().type === 'OP' && peek().value === '-') {
      next();
      return { type: 'neg', node: parseUnary() };
    }
    return parsePow();
  }
  function parsePow() {
    let node = parseAtom();
    if (peek() && peek().type === 'OP' && peek().value === '^') {
      next();
      const rhs = parseUnary();
      node = { type: 'bin', op: '^', left: node, right: rhs };
    }
    return node;
  }
  function parseAtom() {
    const t = peek();
    if (!t) throw new Error('Unexpected end of input');
    if (t.type === 'NUM') { next(); return { type: 'num', value: t.value }; }
    if (t.type === 'VAR') { next(); return { type: 'var', name: t.value }; }
    if (t.type === 'FUNC') {
      next();
      if (!peek() || peek().type !== 'LP') throw new Error('Expected ( after function');
      next();
      const arg = parseAddSub();
      if (!peek() || peek().type !== 'RP') throw new Error('Expected )');
      next();
      return { type: 'func', name: t.value, arg };
    }
    if (t.type === 'LP') {
      next();
      const node = parseAddSub();
      if (!peek() || peek().type !== 'RP') throw new Error('Expected )');
      next();
      return node;
    }
    throw new Error('Unexpected token ' + JSON.stringify(t));
  }

  const ast = parseAddSub();
  if (pos !== toks.length) throw new Error('Unexpected trailing tokens');
  return ast;
}

function safeParseExpr(str) {
  try { return parseExpr(str); } catch (e) { return null; }
}

function evalAst(ast, vars) {
  switch (ast.type) {
    case 'num': return ast.value;
    case 'var':
      if (!(ast.name in vars)) throw new Error('Unbound variable ' + ast.name);
      return vars[ast.name];
    case 'neg': return -evalAst(ast.node, vars);
    case 'func':
      if (ast.name === 'sqrt') {
        const v = evalAst(ast.arg, vars);
        if (v < 0) return NaN;
        return Math.sqrt(v);
      }
      throw new Error('Unknown function ' + ast.name);
    case 'bin': {
      const l = evalAst(ast.left, vars);
      const r = evalAst(ast.right, vars);
      switch (ast.op) {
        case '+': return l + r;
        case '-': return l - r;
        case '*': return l * r;
        case '/': return l / r;
        case '^': return Math.pow(l, r);
      }
      throw new Error('Unknown op ' + ast.op);
    }
  }
  throw new Error('Unknown node type ' + ast.type);
}

function collectVars(ast, set) {
  set = set || new Set();
  switch (ast.type) {
    case 'num': break;
    case 'var': set.add(ast.name); break;
    case 'neg': collectVars(ast.node, set); break;
    case 'func': collectVars(ast.arg, set); break;
    case 'bin': collectVars(ast.left, set); collectVars(ast.right, set); break;
  }
  return set;
}

// Evaluate a string expression at given variable values. Returns NaN on error.
function evalExprStr(str, vars) {
  const ast = safeParseExpr(str);
  if (!ast) return NaN;
  try { return evalAst(ast, vars); } catch (e) { return NaN; }
}

// Check whether two expression strings are numerically equivalent by
// sampling random values for every variable that appears in EITHER one.
// Returns false if variable sets differ, or parsing fails, or any sample
// mismatches (within epsilon), after enough valid (non-NaN/Infinity) trials.
function expressionsEquivalent(userStr, correctStr) {
  const userAst = safeParseExpr(userStr);
  const correctAst = safeParseExpr(correctStr);
  if (!userAst || !correctAst) return false;
  const userVars = collectVars(userAst);
  const correctVars = collectVars(correctAst);
  if (userVars.size !== correctVars.size) return false;
  for (const v of userVars) if (!correctVars.has(v)) return false;
  const varNames = Array.from(correctVars);
  if (varNames.length === 0) {
    // Both constant - compare directly.
    const a = evalAst(userAst, {});
    const b = evalAst(correctAst, {});
    return Math.abs(a - b) < 1e-9;
  }
  const SAMPLE_SETS = [
    [2, 3, 5, 7, 11, 13],
    [3, 5, 2, 7, 4, 6],
    [4, 2, 6, 3, 9, 5],
    [5, 7, 3, 2, 8, 4],
    [7, 4, 9, 5, 2, 3],
  ];
  let validTrials = 0;
  for (const sampleVals of SAMPLE_SETS) {
    const vars = {};
    varNames.forEach((name, idx) => { vars[name] = sampleVals[idx % sampleVals.length] + idx * 0.37; });
    let a, b;
    try { a = evalAst(userAst, vars); } catch (e) { continue; }
    try { b = evalAst(correctAst, vars); } catch (e) { continue; }
    if (!isFinite(a) || !isFinite(b)) continue;
    validTrials++;
    if (Math.abs(a - b) > 1e-6 * Math.max(1, Math.abs(b))) return false;
  }
  return validTrials >= 3;
}



// ===== terms.js =====

// ===================== Term Builders =====================
// Build {str, html} pairs together so display and evaluation can never
// disagree. `str` is parseable by engine.js; `html` is pretty markup.

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randChoice(arr) { return arr[randInt(0, arr.length - 1)]; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = randInt(0, i);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function numTerm(n) { return { str: String(n), html: String(n) }; }
function varTerm(name) { return { str: name, html: `<i>${name}</i>` }; }

function powTerm(base, exp) {
  if (exp === 1) return base;
  // Both str and html must consult base.needsParen the same way: a base like
  // "3*a" (needsParen from mulTerms) must render as "(3a)^2"/"(3*a)^2" in both
  // forms, not "3a^2" (which means 3*(a^2), a different value).
  return { str: `${wrapIfNeeded(base)}^${exp}`, html: `${wrapIfNeededHtml(base)}<sup>${exp}</sup>` };
}

function wrapIfNeeded(t) {
  // Wrap in parens for str if it's a sum (to be safe before applying ^ or coefficients)
  return t.needsParen ? `(${t.str})` : t.str;
}

function paren(t) {
  return { str: `(${t.str})`, html: `(${t.html})`, needsParen: false };
}

// Multiply a list of terms together (implicit multiplication in display,
// explicit * in str for safety).
function mulTerms(terms) {
  const strParts = terms.map(t => wrapIfNeeded(t));
  const htmlParts = terms.map(t => t.needsParen ? `(${t.html})` : t.html);
  return { str: strParts.join('*'), html: htmlParts.join(''), needsParen: true };
}

// HTML counterpart of wrapIfNeeded: wraps t.html in parens when t.needsParen
// is set (e.g. varPart is a sum), so "coefficient times a sum" renders as
// "2(l + 8)" in html exactly as it does in the parseable str form, instead
// of silently dropping the parens and rendering the wrong expression
// ("2l + 8").
function wrapIfNeededHtml(t) {
  return t.needsParen ? `(${t.html})` : t.html;
}

// For coefficient-times-term display: only a SUM needs brackets ("2(l + 8)");
// a product or fraction reads fine without ("36a^2b^2").
function wrapSumHtml(t) {
  return t.isSum ? `(${t.html})` : t.html;
}

// coefficient * variable-part, formatted nicely (omit coefficient of 1,
// show -1 as a bare minus, etc.) `varPart` may be null for a pure number.
function coeffTerm(coeff, varPart) {
  if (varPart === null || varPart === undefined) return numTerm(coeff);
  if (coeff === 1) return varPart;
  // needsParen is false here (on coeffTerm's OWN output): "7u" or "-x" as a
  // coefficient-times-variable term reads unambiguously as a multiplication
  // operand without extra parens (matches the source document's own style,
  // e.g. "6a(2a+2a^2)"). This is separate from whether varPart ITSELF needs
  // wrapping (e.g. a sum like "l + 8"), which wrapIfNeeded(Html) handles.
  if (coeff === -1) return { str: `-${wrapIfNeeded(varPart)}`, html: `-${wrapSumHtml(varPart)}`, needsParen: false };
  return { str: `${coeff}*${wrapIfNeeded(varPart)}`, html: `${coeff}${wrapSumHtml(varPart)}`, needsParen: false };
}

// Add a list of {coeff-including} terms with correct +/- signs.
// terms: array of {str, html} where a negative term already starts with '-'.
function addTerms(terms) {
  let str = '', html = '';
  terms.forEach((t, idx) => {
    const isNeg = t.str.startsWith('-');
    const corePlain = isNeg ? t.str.slice(1) : t.str;
    const coreHtml = isNeg ? t.html.slice(stripMinusLen(t.html)) : t.html;
    if (idx === 0) {
      str += t.str;
      html += t.html;
    } else {
      str += isNeg ? ` - ${corePlain}` : ` + ${t.str}`;
      html += isNeg ? ` - ${coreHtml}` : ` + ${t.html}`;
    }
  });
  return { str, html, needsParen: true, isSum: true };
}
function stripMinusLen(html) {
  // html starts with '-' char
  return 1;
}

function fracTerm(num, den) {
  return {
    str: `(${num.str})/(${den.str})`,
    html: `<span class="frac"><span class="fnum">${num.html}</span><span class="fden">${den.html}</span></span>`,
    needsParen: true,
  };
}

function sqrtTerm(inner) {
  return { str: `sqrt(${inner.str})`, html: `&radic;<span class="sqin">${inner.html}</span>`, needsParen: true };
}



// ===== E/T namespace aliases (for topics.js/distractors.js internal qualified calls) =====

const E = { tokenize, insertImplicitMul, parseExpr, safeParseExpr, evalAst, collectVars, evalExprStr, expressionsEquivalent };

const T = { randInt, randChoice, shuffle, numTerm, varTerm, powTerm, paren, mulTerms, coeffTerm, addTerms, fracTerm, sqrtTerm, wrapIfNeeded, wrapIfNeededHtml };

const VARS_POOL = ['a','b','c','d','e','f','g','h','j','k','m','n','p','q','r','s','t','u','v','w','x','y','z'];
function pickVars(n) { return shuffle(VARS_POOL).slice(0, n); }

function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }

function fracToStr(num, den) {
  const g = gcd(num, den) || 1;
  num /= g; den /= g;
  if (den < 0) { den = -den; num = -num; }
  if (den === 1) return String(num);
  return `${num}/${den}`;
}

// ---------- Topic 1: Substitution ----------
// Built from the worksheet's own three sets of expressions and values:
//   basic    : "If t = 3, evaluate" (t+2, t×2, t÷3, 10t, t-1, 12-2t, 4t+1, 2(3+t)+t, 30-(2t-1))
//   fraction : "Substitute a = 5"  (30/a+3, (5+a)/a, 6a+3(a-2), 20/a+2a(a+4), 3(3a-5)/(a+10), 100-4(3+4a))
//   twoVar   : "x = 2 and y = 3"   (3xy, 3x^2, y^2-x^2, 2x^2+y/3-xy, sqrt(3y)+sqrt(6xy), sqrt(x^2+y^2+3), (3x)^2-y^2, 24+2xy^2/2)
// Only the letters are randomised; the expressions and values are the worksheet's.
// Stages follow the worksheet's own order, simplest first:
//   0: t+2, t×2, t÷3, 10t, t-1, 12-2t                    (t = 3)
//   1: 4t+1, 2(3+t)+t, 30-(2t-1)                          (t = 3)  and  3xy, 3x², y²-x²  (x = 2, y = 3)
//   2: the a = 5 set with fractions                        (30/a+3 ... 100-4(3+4a))
//   3: the remaining two-variable items (roots, (3x)²-y², ...)
// `tier` is a stage number 0-3 (the old names 'basic'/'fraction'/'twoVar' map to 0/2/3).
function genSubstitutionRaw(tier) {
  const stage = typeof tier === 'number' ? tier : ({ basic: 0, fraction: 2, twoVar: 3 })[tier];
  const [vx, vy] = pickVars(2);
  const X = varTerm(vx), Y = varTerm(vy);
  const xy = { str: `${vx}*${vy}`, html: `<i>${vx}</i><i>${vy}</i>`, needsParen: false };
  const one = (V, val, expr) => { const v = V.str; const vars = { [v]: val };
    return { prompt: `If ${v} = ${val}, evaluate:`, exprHtml: expr.html, exprStr: expr.str, vars, answer: E.evalExprStr(expr.str, vars) }; };
  const two = (expr) => { const vars = { [vx]: 2, [vy]: 3 };
    return { prompt: `If ${vx} = 2 and ${vy} = 3, evaluate:`, exprHtml: expr.html, exprStr: expr.str, vars, answer: Math.round(E.evalExprStr(expr.str, vars)) }; };
  const T3 = X; // single-letter set uses vx as its letter (t = 3 / a = 5)
  const pools = {
    0: [
      () => one(T3, 3, addTerms([T3, numTerm(2)])),
      () => one(T3, 3, { str: `${vx}*2`, html: `<i>${vx}</i> &times; 2`, needsParen: true }),
      () => one(T3, 3, { str: `${vx}/3`, html: `<i>${vx}</i> &divide; 3`, needsParen: true }),
      () => one(T3, 3, coeffTerm(10, T3)),
      () => one(T3, 3, addTerms([T3, numTerm(-1)])),
      () => one(T3, 3, addTerms([numTerm(12), coeffTerm(-2, T3)])),
    ],
    1: [
      () => one(T3, 3, addTerms([coeffTerm(4, T3), numTerm(1)])),
      () => one(T3, 3, addTerms([coeffTerm(2, addTerms([numTerm(3), T3])), T3])),
      () => one(T3, 3, addTerms([numTerm(30), coeffTerm(-1, addTerms([coeffTerm(2, T3), numTerm(-1)]))])),
      () => two(coeffTerm(3, xy)),
      () => two(coeffTerm(3, powTerm(X, 2))),
      () => two(addTerms([powTerm(Y, 2), coeffTerm(-1, powTerm(X, 2))])),
    ],
    2: [
      () => one(T3, 5, addTerms([fracTerm(numTerm(30), T3), numTerm(3)])),
      () => one(T3, 5, fracTerm(addTerms([numTerm(5), T3]), T3)),
      () => one(T3, 5, addTerms([coeffTerm(6, T3), coeffTerm(3, addTerms([T3, numTerm(-2)]))])),
      () => one(T3, 5, addTerms([fracTerm(numTerm(20), T3), mulTerms([numTerm(2), T3, addTerms([T3, numTerm(4)])])])),
      () => one(T3, 5, fracTerm(mulTerms([numTerm(3), addTerms([coeffTerm(3, T3), numTerm(-5)])]), addTerms([T3, numTerm(10)]))),
      () => one(T3, 5, addTerms([numTerm(100), coeffTerm(-4, addTerms([numTerm(3), coeffTerm(4, T3)]))])),
    ],
    3: [
      () => two(addTerms([coeffTerm(2, powTerm(X, 2)), fracTerm(Y, numTerm(3)), coeffTerm(-1, xy)])),
      () => two(addTerms([sqrtTerm(coeffTerm(3, Y)), sqrtTerm(mulTerms([numTerm(6), X, Y]))])),
      () => two(sqrtTerm(addTerms([powTerm(X, 2), powTerm(Y, 2), numTerm(3)]))),
      () => two(addTerms([powTerm(mulTerms([numTerm(3), X]), 2), coeffTerm(-1, powTerm(Y, 2))])),
      () => two(addTerms([numTerm(24), fracTerm(mulTerms([numTerm(2), X, powTerm(Y, 2)]), numTerm(2))])),
    ],
  };
  return randChoice(pools[Math.max(0, Math.min(3, stage))])();
}

// Only whole-number answers (all worksheet items already are).
